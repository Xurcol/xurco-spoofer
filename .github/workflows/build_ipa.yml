name: Build Xurco Spoofer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app
        run: |
          xcodebuild clean archive -project XurcoSpoofer.xcodeproj -scheme XurcoSpoofer -configuration Debug -archivePath build/XurcoSpoofer.xcarchive -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=17.4
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/XurcoSpoofer.xcarchive/Products/Applications/XurcoSpoofer.app Payload/
          zip -r Xurco-Spoofer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Xurco-Spoofer-iPhone
          path: Xurco-Spoofer.ipa
          retention-days: 30
